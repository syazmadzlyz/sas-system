<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Set New Password - SAS</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh;">

    <div class="glass-card" style="padding: 2.5rem; width: 100%; max-width: 400px; text-align: center;">
        <h2 style="margin-bottom: 1rem; color: var(--primary);">🔒 Set New Password</h2>
        <p class="text-muted" style="margin-bottom: 2rem;">If Admin approved your request, set your new password here.
        </p>

        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
        {% for category, message in messages %}
        <div class="flash flash-{{ category }}" style="margin-bottom: 1.5rem; text-align: left;">
            {{ message }}
        </div>
        {% endfor %}
        {% endif %}
        {% endwith %}

        <form method="POST">
            <div class="form-group" style="text-align: left;">
                <label>Username</label>
                <input type="text" name="username" required placeholder="Confirm your username">
            </div>

            <div class="form-group" style="text-align: left;">
                <label>New Password</label>
                <input type="password" name="password" required placeholder="Min 6 chars">
            </div>

            <div class="form-group" style="text-align: left;">
                <label>Confirm Password</label>
                <input type="password" name="confirm_password" required>
            </div>

            <button type="submit" class="btn btn-primary btn-block">Change Password</button>
        </form>

        <div style="margin-top: 1.5rem;">
            <a href="{{ url_for('auth.login') }}" class="btn btn-ghost btn-sm">Back to Login</a>
        </div>
    </div>

</body>

</html>
