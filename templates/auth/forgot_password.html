<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Forgot Password - SAS</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh;">

    <div class="glass-card" style="padding: 2.5rem; width: 100%; max-width: 400px; text-align: center;">
        <h2 style="margin-bottom: 1rem; color: var(--primary);">🔑 Forgot Password</h2>
        <p class="text-muted" style="margin-bottom: 2rem;">Enter your Username or Email to request a reset.</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
        {% for category, message in messages %}
        <div class="flash flash-{{ category }}" style="margin-bottom: 1.5rem; text-align: left;">
            {{ message }}
        </div>
        {% endfor %}
        {% endif %}
        {% endwith %}

        <form method="POST">
            <div class="form-group" style="text-align: left;">
                <label>Username / Email</label>
                <input type="text" name="identifier" required placeholder="e.g. syazmadzly">
            </div>

            <button type="submit" class="btn btn-primary btn-block">Request Reset</button>
        </form>

        <div style="margin-top: 1.5rem;">
            <a href="{{ url_for('auth.login') }}" class="btn btn-ghost btn-sm">Back to Login</a>
            <span style="margin: 0 0.5rem; color: var(--gray-300);">|</span>
            <a href="{{ url_for('auth.reset_password') }}" class="btn btn-ghost btn-sm">I have Approval</a>
        </div>
    </div>

</body>

</html>
