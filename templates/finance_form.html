{% extends "base.html" %}

{% block title %}Add Transaction - SAS{% endblock %}

{% block content %}
<div class="container">
    <div class="page-header">
        <h1>{% if transaction %}✏️ Edit Transaction{% else %}➕ Add Transaction{% endif %}</h1>
    </div>

    <div class="form-container">
        <div class="card glass-card">
            <div class="card-body">
                <form method="POST" class="modern-form">
                    <div class="form-group">
                        <label for="semester">Semester *</label>
                        <input type="text" id="semester" name="semester"
                            value="{{ transaction.semester if transaction else 'Sem 1 2024/2025' }}"
                            placeholder="e.g., Sem 1 2024/2025" class="form-control" required>
                    </div>

                    <div class="form-group">
                        <label for="category">Category *</label>
                        <select id="category" name="category" class="form-control" required>
                            {% for code, name in categories %}
                            <option value="{{ code }}" {% if transaction and transaction.category==code %}selected{%
                                endif %}>
                                {{ name }}
                            </option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="description">Description *</label>
                        <input type="text" id="description" name="description"
                            value="{{ transaction.description if transaction else '' }}"
                            placeholder="e.g., Semester 1 Tuition Fee" class="form-control" required>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="amount">Amount (RM) *</label>
                            <input type="number" id="amount" name="amount" step="0.01" min="0"
                                value="{{ transaction.amount if transaction else '' }}" placeholder="0.00"
                                class="form-control" required>
                        </div>

                        <div class="form-group">
                            <label for="transaction_date">Date *</label>
                            <input type="date" id="transaction_date" name="transaction_date"
                                value="{{ transaction.transaction_date.strftime('%Y-%m-%d') if transaction else '' }}"
                                class="form-control" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="receipt_number">Receipt Number</label>
                        <input type="text" id="receipt_number" name="receipt_number"
                            value="{{ transaction.receipt_number if transaction else '' }}" placeholder="Optional"
                            class="form-control">
                    </div>

                    <div class="form-group">
                        <label for="notes">Notes</label>
                        <textarea id="notes" name="notes" rows="2" class="form-control"
                            placeholder="Additional notes...">{{ transaction.notes if transaction else '' }}</textarea>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary">
                            {% if transaction %}Update{% else %}Add{% endif %} Transaction
                        </button>
                        <a href="{{ url_for('finance.index') }}" class="btn btn-outline">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
