{% extends "base.html" %}

{% block title %}Add Exam - SAS{% endblock %}

{% block content %}
<div class="container">
    <div class="page-header">
        <h1>{% if exam %}✏️ Edit Exam{% else %}➕ Add Exam{% endif %}</h1>
    </div>

    <div class="form-container">
        <div class="card glass-card">
            <div class="card-body">
                <form method="POST" class="modern-form">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="subject_code">Subject Code</label>
                            <input type="text" id="subject_code" name="subject_code"
                                value="{{ exam.subject_code if exam else '' }}" placeholder="e.g., INFO 4501"
                                class="form-control">
                        </div>

                        <div class="form-group flex-2">
                            <label for="subject_name">Subject Name *</label>
                            <input type="text" id="subject_name" name="subject_name"
                                value="{{ exam.subject_name if exam else '' }}" placeholder="e.g., Software Engineering"
                                class="form-control" required>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="exam_date">Exam Date *</label>
                            <input type="date" id="exam_date" name="exam_date"
                                value="{{ exam.exam_date.strftime('%Y-%m-%d') if exam else '' }}" class="form-control"
                                required>
                        </div>

                        <div class="form-group">
                            <label for="start_time">Start Time</label>
                            <input type="time" id="start_time" name="start_time"
                                value="{{ exam.start_time.strftime('%H:%M') if exam and exam.start_time else '' }}"
                                class="form-control">
                        </div>

                        <div class="form-group">
                            <label for="duration">Duration (minutes)</label>
                            <input type="number" id="duration" name="duration"
                                value="{{ exam.duration_minutes if exam else 180 }}" min="30" max="360"
                                class="form-control">
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="venue">Venue</label>
                            <input type="text" id="venue" name="venue" value="{{ exam.venue if exam else '' }}"
                                placeholder="e.g., CAC Main Hall" class="form-control">
                        </div>

                        <div class="form-group">
                            <label for="seat_number">Seat Number</label>
                            <input type="text" id="seat_number" name="seat_number"
                                value="{{ exam.seat_number if exam else '' }}" placeholder="e.g., A15"
                                class="form-control">
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="notes">Notes</label>
                        <textarea id="notes" name="notes" rows="2" class="form-control"
                            placeholder="Study chapters, allowed materials, etc.">{{ exam.notes if exam else '' }}</textarea>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary">
                            {% if exam %}Update{% else %}Add{% endif %} Exam
                        </button>
                        <a href="{{ url_for('exam_schedule.index') }}" class="btn btn-outline">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
