{% extends "base.html" %}

{% block title %}Add Task - SAS{% endblock %}

{% block content %}
<div class="container">
    <div class="page-header">
        <h1>{% if task %}✏️ Edit Task{% else %}➕ Add Task{% endif %}</h1>
    </div>

    <div class="form-container">
        <div class="card glass-card">
            <div class="card-body">
                <form method="POST" class="modern-form">
                    <div class="form-group">
                        <label for="title">Task Title *</label>
                        <input type="text" id="title" name="title" value="{{ task.title if task else '' }}"
                            placeholder="What do you need to do?" class="form-control" required>
                    </div>

                    <div class="form-group">
                        <label for="description">Description</label>
                        <textarea id="description" name="description" rows="2" class="form-control"
                            placeholder="Additional details...">{{ task.description if task else '' }}</textarea>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="due_date">Due Date</label>
                            <input type="date" id="due_date" name="due_date"
                                value="{{ task.due_date.strftime('%Y-%m-%d') if task and task.due_date else '' }}"
                                class="form-control">
                        </div>

                        <div class="form-group">
                            <label for="due_time">Due Time</label>
                            <input type="time" id="due_time" name="due_time"
                                value="{{ task.due_time.strftime('%H:%M') if task and task.due_time else '' }}"
                                class="form-control">
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="priority">Priority</label>
                            <select id="priority" name="priority" class="form-control">
                                <option value="low" {% if task and task.priority=='low' %}selected{% endif %}>🟢 Low
                                </option>
                                <option value="medium" {% if not task or task.priority=='medium' %}selected{% endif %}>
                                    🟡 Medium</option>
                                <option value="high" {% if task and task.priority=='high' %}selected{% endif %}>🟠 High
                                </option>
                                <option value="urgent" {% if task and task.priority=='urgent' %}selected{% endif %}>🔴
                                    Urgent</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="category">Category</label>
                            <select id="category" name="category" class="form-control">
                                <option value="">Select category</option>
                                {% for cat in categories %}
                                <option value="{{ cat }}" {% if task and task.category==cat %}selected{% endif %}>
                                    {{ cat|replace('_', ' ')|title }}
                                </option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="estimated_hours">Estimated Hours</label>
                        <input type="number" id="estimated_hours" name="estimated_hours" step="0.5" min="0"
                            value="{{ task.estimated_hours if task else '' }}" placeholder="e.g., 2"
                            class="form-control">
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary">
                            {% if task %}Update{% else %}Add{% endif %} Task
                        </button>
                        <a href="{{ url_for('planner.index') }}" class="btn btn-outline">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
